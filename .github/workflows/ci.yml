name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate scripts
        run: |
          bash -n scripts/install.sh
          bash -n scripts/check-sdd.sh
          node bin/sdd-dev-kit.js --help
          node bin/sdd-dev-kit.js version

      - name: Validate CLI installation
        run: |
          rm -rf /tmp/sdd-dev-kit-ci
          mkdir -p /tmp/sdd-dev-kit-ci
          node bin/sdd-dev-kit.js init --all-agents --target /tmp/sdd-dev-kit-ci
          node bin/sdd-dev-kit.js check --target /tmp/sdd-dev-kit-ci
          bash scripts/check-sdd.sh /tmp/sdd-dev-kit-ci

      - name: Validate package contents
        run: npm pack --dry-run
